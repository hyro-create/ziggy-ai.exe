# Construit Ziggy-Setup.exe sur un Windows 11/Server GRATUIT de GitHub, sans rien installer chez toi.
# Utilisation : onglet « Actions » > « Construire Ziggy-Setup.exe » > « Run workflow » ; l'installateur est dans « Artifacts ».
name: Construire Ziggy-Setup.exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    env:
      ZIGGY_NOPAUSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Inno Setup
        shell: cmd
        run: choco install innosetup --no-progress -y
      - name: Tests, compilation et test de fumée
        shell: cmd
        run: build.bat
      - name: Créer l'installateur
        shell: cmd
        run: installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Ziggy-Setup
          path: installer_output/Ziggy-Setup.exe
