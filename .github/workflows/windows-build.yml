
# Construit Ziggy-Setup.exe sur Windows via GitHub Actions
name: Construire Ziggy-Setup.exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    env:
      ZIGGY_NOPAUSE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Inno Setup
        shell: cmd
        run: choco install innosetup --no-progress -y

      - name: Tests et compilation
        shell: cmd
        run: build.bat

      - name: Créer l'installateur
        shell: cmd
        run: installer.bat

      - name: Vérifier l'installateur
        shell: pwsh
        run: |
          if (!(Test-Path "installer_output/Ziggy-Setup.exe")) {
            Write-Error "Ziggy-Setup.exe introuvable dans installer_output"
            exit 1
          }

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Ziggy-Setup
          path: installer_output/Ziggy-Setup.exe
          if-no-files-found: error

